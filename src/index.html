<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@100..900&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.js"></script>
</head>
<body>
    <div class="container">
        <div class="inner-container container">
            <h2 class="subtitle">Student Manager</h2>
            <ul>
                <li>
                    <div class="input-box">
                        <label for="name">Name:</label>
                        <input class="user-input name" type="text" placeholder="Enter student name..."/>
                        <label for="age">Age:</label>
                        <input class="user-input age" type="number" placeholder="Age...">
                    </div>
            </ul>
            <!--  bio phy chem out of 100 each -->
            <h4 class="subtitle mini-subtitle">Enter Marks Here</h4>
            <ul class="input-list">
                <li>
                    <div class="input-box">
                        <label for="marks">Math:</label>
                        <input class="marks" type="number" />
                    </div>
                </li>
                <li>
                    <div class="input-box">
                        <label for="marks">Physics:</label>
                        <input class="marks" type="number" />
                    </div>
                </li>
                <li>
                    <div class="input-box">
                        <label for="marks">Chemistry:</label>
                        <input class="marks" type="number" />
                    </div>
                </li>
            </ul>
            <button class="calculate">Calculate</button>
            <div class="percentage-box">
                <div class="text"><p>Percentage:</p></div>
                <div class="percentage"><p id="percent">0%</p></div>
            </div>
        </div>
        <div class="student-data">
            <h4 class="subtitle mini-subtitle">Student Data</h4>
            <ul class="student-list">
                <li>
                    <div class="student-card">
                        <p class="name header">Name</p>
                        <p class="Age header">Age</p>
                        <p class="bio header">Biology</p>
                        <p class="chem header">Chemistry</p>
                        <p class="phy header">Phyiscs</p>
                        <p class="percent header">Percentage</p>
                    </div>
                </li>
            </ul>
        </div>
    </div>
    <script type="module" src="./script.js"></script>
</body>
</html>
