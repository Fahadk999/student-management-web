<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@100..900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div class="inner-container container">
            <h2 class="subtitle">Student Manager</h2>
            <ul>
                <li>
                    <div class="input-box">
                        <label for="s-name">Name:</label>
                        <input class="s-name" type="text" placeholder="Enter student name..."/>
                    </div>
            </ul>
            <!--  math phy chem out of 100 each -->
            <h4 class="subtitle mini-subtitle">Enter Marks Here</h4>
            <ul>
                <li>
                    <div class="input-box">
                        <label for="marks">Math:</label>
                        <input class="marks" type="number" />
                    </div>
                </li>
                <li>
                    <div class="input-box">
                        <label for="marks">Physics:</label>
                        <input class="marks" type="number" />
                    </div>
                </li>
                <li>
                    <div class="input-box">
                        <label for="marks">Chemistry:</label>
                        <input class="marks" type="number" />
                    </div>
                </li>
            </ul>
            <button class="calculate">Calculate</button>
            <div class="percentage-box">
                <div class="text"><p>Percentage:</p></div>
                <div class="percentage"><p id="percent">0%</p></div>
            </div>
        </div>
        <div class="student-data">
            <h4 class="subtitle mini-subtitle">Student Data</h4>
            <ul class="student-list"></ul>
        </div>
    </div>
    <script type="module" src="./script.js"></script>
</body>
</html>
